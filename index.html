<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ViralZone BD</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script src="https://ad.gigapub.tech/script?id=1096"></script>
    <script src="https://libtl.com/sdk.js" data-zone="11951511" data-sdk="show_11951511"></script>

    <style>
        :root {
            --bg-dark: #070b14;
            --card-bg: #121826;
            --primary: #f43f5e;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --premium-gradient: linear-gradient(135deg, #f43f5e 0%, #fb7185 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 15px 12px 100px;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -0.5px;
        }

        .brand-icon {
            background: var(--primary);
            color: white;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
        }

        .top-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
        }

        /* Header Titles */
        .curated-subtitle {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .trending-title-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 15px;
        }

        .trending-title {
            font-size: 24px;
            font-weight: 800;
        }

        .trending-title span {
            color: var(--primary);
        }

        .view-categories {
            font-size: 12px;
            color: var(--text-dim);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Filter Pills */
        .filter-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 10px;
            scrollbar-width: none;
        }

        .filter-container::-webkit-scrollbar {
            display: none;
        }

        .filter-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-dim);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-pill.active {
            background: rgba(244, 63, 94, 0.15);
            border-color: var(--primary);
            color: white;
        }

        /* Post Grid (2 Columns) */
        #postArea {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .post {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
        }

        .post img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
        }

        .badge-18 {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .duration-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .post-content {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .post-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .post-category {
            font-size: 9px;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .post-views {
            font-size: 10px;
            color: var(--text-dim);
        }

        .post-title {
            font-weight: 600;
            font-size: 12px;
            line-height: 1.3;
            margin-bottom: 8px;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: var(--primary);
            transition: width 0.4s ease;
        }

        .buy-button {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-weight: 700;
            font-size: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.1s;
            margin-top: auto;
        }

        .buy-button:active {
            transform: scale(0.96);
        }

        .buy-button.completed {
            background: #10b981;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="top-bar">
        <div class="brand-logo">
            <div class="brand-icon">V</div>
            ViralZone BD
        </div>
        <div class="top-actions">
            <button class="icon-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button class="icon-btn"><i class="fa-solid fa-bars"></i></button>
        </div>
    </div>

    <!-- Section Header -->
    <div class="curated-subtitle">Curated For You</div>
    <div class="trending-title-wrapper">
        <div class="trending-title">Trending <span>now</span></div>
        <a href="#" class="view-categories">View categories <i class="fa-solid fa-chevron-right" style="font-size: 9px;"></i></a>
    </div>

    <!-- Filter Pills -->
    <div class="filter-container">
        <div class="filter-pill active">All picks</div>
        <div class="filter-pill">Spotlight</div>
        <div class="filter-pill">Studio</div>
        <div class="filter-pill">Shorts</div>
        <div class="filter-pill">Creators</div>
    </div>

    <!-- Dynamic Post List Area -->
    <div id="postArea"></div>

    <script>
        // --- Configuration ---
        const REQUIRED_ADS = 5; // ৫টি অ্যাড লিমিট
        const DIRECT_LINK = "https://omg10.com/4/6765363"; // আপনার ইনকাম বাড়ানোর ডিরেক্ট লিঙ্ক
        const adsWatched = JSON.parse(localStorage.getItem('ads_progress') || '{}');

        // --- Dual Ad Engine ---
        async function showAnyAd() {
            return new Promise(async (resolve) => {
                let adShown = false;

                // 1. Monetag
                try {
                    if (typeof show_11951511 === 'function') {
                        await show_11951511();
                        adShown = true;
                    }
                } catch (e) { console.log("Monetag failed..."); }

                if (adShown) return resolve(true);

                // 2. Giga.pub Fallback
                try {
                    if (typeof triggerAd === 'function') {
                        triggerAd();
                        adShown = true;
                    }
                } catch (e) { console.log("Giga failed."); }

                setTimeout(() => resolve(adShown), 2000);
            });
        }

        // --- Logic ---
        async function handleAction(id, link, btn) {
            let current = adsWatched[id] || 0;

            // যদি সবগুলো অ্যাড দেখা হয়ে যায়
            if(current >= REQUIRED_ADS) {
                window.open(link, '_blank');
                return;
            }

            const success = await showAnyAd();

            if(success) {
                current++;
                adsWatched[id] = current;
                localStorage.setItem('ads_progress', JSON.stringify(adsWatched));

                // প্রোগ্রেস বার আপডেট
                const progress = btn.parentElement.querySelector('.progress');
                if(progress) progress.style.width = `${(current/REQUIRED_ADS)*100}%`;

                // প্রতিটা অ্যাড দেখার পর অটো ডিরেক্ট লিঙ্ক ওপেন হবে
                setTimeout(() => {
                    window.open(DIRECT_LINK, '_blank');
                }, 800);

                // বাটন টেক্সট আপডেট
                if(current >= REQUIRED_ADS) {
                    btn.textContent = "🚀 DOWNLOAD NOW";
                    btn.classList.add('completed');
                } else {
                    btn.textContent = `🔓 UNLOCK (${current}/${REQUIRED_ADS})`;
                }
            }
        }

        // --- Firebase Initialization ---
        const firebaseConfig = {
            apiKey: "AIzaSyDI2MyfbMFYd6HAkCdZ2A64uNhC16H5Ku4",
            databaseURL: "https://bdvideo-fc2e8-default-rtdb.firebaseio.com",
            projectId: "bdvideo-fc2e8",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('posts').on('value', snap => {
            const data = snap.val();
            const postArea = document.getElementById('postArea');
            postArea.innerHTML = '';

            Object.entries(data || {}).forEach(([id, p]) => {
                const count = adsWatched[id] || 0;
                const div = document.createElement('div');
                div.className = 'post';
                div.innerHTML = `
                    <div class="thumbnail-container">
                        <img src="${p.imageLink}">
                        <div class="badge-18">18+</div>
                        <div class="play-overlay"><i class="fa-solid fa-play"></i></div>
                        <div class="duration-badge">${p.duration || '05:30'}</div>
                    </div>
                    <div class="post-content">
                        <div class="post-meta-row">
                            <span class="post-category">${p.category || 'Spotlight'}</span>
                            <span class="post-views"><i class="fa-solid fa-eye" style="font-size:9px;"></i> ${p.views || '15.4K'}</span>
                        </div>
                        <div class="post-title">${p.title}</div>
                        <div class="progress-bar"><div class="progress" style="width:${(count/REQUIRED_ADS)*100}%"></div></div>
                        <button class="buy-button ${count >= REQUIRED_ADS ? 'completed' : ''}" id="ps_${id}">
                            ${count >= REQUIRED_ADS ? '🚀 DOWNLOAD NOW' : `🔓 UNLOCK (${count}/${REQUIRED_ADS})`}
                        </button>
                    </div>
                `;
                postArea.appendChild(div);
                div.querySelector('button').onclick = (e) => handleAction(id, p.downloadLink, e.target);
            });
        });
    </script>
</body>
</html>
